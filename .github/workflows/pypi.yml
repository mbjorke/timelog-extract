# Publish sdist + wheel to PyPI (trusted publishing / OIDC) and create a
# GitHub Release so the Releases page "Latest" badge tracks the tag.
# Configure this repository as a trusted publisher on https://pypi.org before the first run.
# Filename must stay `pypi.yml` — PyPI trusted publisher is keyed on it.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.0.0"
      - name: Build sdist and wheel
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Git tags alone do not update the Releases UI. Without this job, "Latest"
  # stays on the last hand-published Release (historically v0.2.17) even when
  # newer v0.3.x tags exist. See docs/runbooks/versioning.md.
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract CHANGELOG section
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          python3 scripts/changelog_section.py "$VERSION" > /tmp/release-notes.md
          {
            echo "**Install:** \`pip install -U timelog-extract\` / \`curl -fsSL https://gittan.sh/install | bash\`"
            echo
            cat /tmp/release-notes.md
          } > /tmp/release-body.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-body.md \
            --verify-tag \
            --latest
